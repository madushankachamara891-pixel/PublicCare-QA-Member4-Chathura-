spring:
  application:
    name: publiccare-backend
  mvc:
    problemdetails:
      enabled: true
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/publiccare_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 2
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

publiccare:
  upload:
    directory: ${PUBLICCARE_UPLOAD_DIR:${user.home}/.publiccare/uploads}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    db:
      enabled: true

server:
  error:
    include-message: never
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
